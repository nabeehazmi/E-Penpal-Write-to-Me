  <!-- Google Fonts: Nunito for warm rounded headings & Plus Jakarta Sans for crisp 16px+ legibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Nunito"', 'system-ui', 'sans-serif'],

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 16px;
      color: #1e293b;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 45%, #eef2ff 100%);
      min-height: 100vh;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Nunito', system-ui, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-float {
      animation: floatGentle 3.2s ease-in-out infinite;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.97) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    .animate-shake {
      animation: shakeError 0.35s ease-in-out;
    }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.35); }
      70% { box-shadow: 0 0 0 8px rgba(79, 70, 229, 0); }
      100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
    }
    .speaking-pulse {
      animation: pulseRing 1.4s infinite;
    }
  </style>
</head>

    function buildAdaptiveRound2Reaction(topicId, r1Body) {
      const text = (r1Body || '').toLowerCase();

      if (topicId === 'alex') {
        const states = [
          'terengganu', 'penang', 'pulau pinang', 'johor', 'sabah', 'sarawak',
          'perak', 'selangor', 'melaka', 'malacca', 'pahang', 'kedah', 'kelantan',
          'perlis', 'negeri sembilan', 'kuala lumpur', 'putrajaya', 'labuan'
        ];
        const foundState = states.find(s => text.includes(s));
        const displayState = foundState
          ? foundState.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')
          : null;

        const places = ['beach', 'park', 'museum', 'zoo', 'waterfall', 'hill', 'island', 'aquarium', 'library', 'kampung', 'mall', 'lake'];
        const foundPlace = places.find(p => text.includes(p));

        if (displayState && foundPlace) {
          return `Thank you for writing back! Living in ${displayState} sounds great, and visiting the ${foundPlace} sounds super fun!`;
        }
        if (displayState) {
          return `Thank you for writing back! Living in ${displayState} sounds awesome, and I would love to visit there one day!`;
        }
        if (foundPlace) {
          return `Thank you for your lovely reply! Visiting the ${foundPlace} sounds like a wonderful activity!`;
        }
        return 'Thank you for your lovely email! It sounds like you live in a really wonderful place.';
      }

      if (topicId === 'sara') {
        const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
        const foundDay = days.find(d => text.includes(d));
        if (foundDay) {
          const capDay = foundDay.charAt(0).toUpperCase() + foundDay.slice(1);
          return `Thanks for telling me about your week! ${capDay} sounds like a really exciting day for you.`;
        }
        return 'Thanks for telling me all about your week! Your school and home activities sound great.';
      }

      if (topicId === 'aina') {
        const festivals = [
          { key: 'hari raya', label: 'Hari Raya' },
          { key: 'aidilfitri', label: 'Hari Raya Aidilfitri' },
          { key: 'chinese new year', label: 'Chinese New Year' },
          { key: 'deepavali', label: 'Deepavali' },
          { key: 'gawai', label: 'Gawai Dayak' },
          { key: 'kaamatan', label: 'Kaamatan' },
          { key: 'christmas', label: 'Christmas' },
          { key: 'merdeka', label: 'Merdeka Day' }
        ];
        const foundFest = festivals.find(f => text.includes(f.key));
        if (foundFest) {
          return `Thank you so much for sharing! ${foundFest.label} sounds like such a joyful and delicious celebration.`;
        }
        return 'Thank you so much for sharing! Your celebration traditions and festive food sound wonderful.';
      }

      if (/\b(well|healthy|happy|great|good|fine|energetic)\b/.test(text)) {
        return 'Thank you for your caring reply! I am glad to hear that you are feeling well and healthy today.';
      }
      return 'Thank you for your caring reply and great health tips!';
    }

        const unDoubled = (stem.length >= 3 && stem[stem.length - 1] === stem[stem.length - 2]) ? stem.slice(0, -1) : stem;
        return { base: unDoubled, baseAlt: stem + 'e', formType: 'ing', posLabel: 'verb (-ing form)' };
      }
      if (searchedLower.endsWith('ies') && searchedLower.length > 4) {
        return { base: searchedLower.slice(0, -3) + 'y', formType: 'plural_or_3sg', posLabel: 'plural noun / verb' };
      }
      if (searchedLower.endsWith('s') && searchedLower.length > 3 && !searchedLower.endsWith('ss') && !searchedLower.endsWith('us') && !searchedLower.endsWith('is')) {
        const stem = searchedLower.endsWith('es') && searchedLower.length > 4 ? searchedLower.slice(0, -2) : searchedLower.slice(0, -1);
        return { base: stem, baseAlt: searchedLower.slice(0, -1), formType: 'plural_or_3sg', posLabel: 'plural noun / verb' };
      }
      return { base: searchedLower, formType: 'base', posLabel: null };
    }

    function buildKidSafeExample(word, pos = 'word', definition = '', inflectionInfo = null) {
      const exact = String(word || '').trim();
      const lowerWord = exact.toLowerCase();
      const lowerPos = String(pos || '').toLowerCase();
      const formType = inflectionInfo ? inflectionInfo.formType : 'base';

      if (formType === 'comparative' || lowerPos.includes('comparative')) {
        return `This pencil is ${lowerWord} than that pen.`;
      }
      if (formType === 'superlative' || lowerPos.includes('superlative')) {
        return `This storybook is the ${lowerWord} one in class.`;
      }
      if (formType === 'past' || lowerPos.includes('past')) {
        return `Yesterday, I ${lowerWord} with my family at home.`;
      }
      if (formType === 'ing' || lowerPos.includes('-ing')) {
        return `I enjoy ${lowerWord} with my friends after school.`;
      }
      if (lowerPos.includes('adjective')) {
        if (/\b(price|cost|money|cheap|afford|bargain|discount)\b/i.test(definition)) {
          return `The storybooks at the shop are ${lowerWord} today.`;
        }
        return `My new storybook is very ${lowerWord} and fun.`;
      }
      if (lowerPos.includes('plural')) {
        return `We saw many ${lowerWord} during our school trip.`;
      }
      if (lowerPos.includes('noun')) {
        if (/\b(place|building|room|hall|shop|park|centre|center|area|town|city)\b/i.test(definition)) {
          return `My family likes to visit the ${lowerWord} together.`;
        }
        if (/\b(food|dish|meal|fruit|drink|snack|rice|bread|cake|sweet)\b/i.test(definition)) {
          return `We ate delicious ${lowerWord} together at home.`;
        }
        return `I brought a ${lowerWord} to school today.`;
      }
      if (lowerPos.includes('verb')) {
        if (lowerWord.endsWith('s') && !lowerWord.endsWith('ss')) {
          return `Your school trip ${lowerWord} really fun and exciting!`;
        }
        return `Every weekend, I like to ${lowerWord} at home.`;
      }
      if (lowerPos.includes('adverb')) {
        return `The pupils worked ${lowerWord} in the classroom.`;
      }
      return `We learned the word ${lowerWord} in class today.`;
    }

    function adaptDefinitionForInflection(rawDef, searchedWord, inflectionInfo) {
      const cleanDef = (rawDef || '').trim();
      if (!inflectionInfo || inflectionInfo.formType === 'base') return cleanDef;
      const base = inflectionInfo.base;
      if (inflectionInfo.formType === 'comparative') {
        return `More ${base} than something else (${cleanDef.charAt(0).toLowerCase() + cleanDef.slice(1).replace(/\.$/, '')}).`;
      }
      if (inflectionInfo.formType === 'superlative') {
        return `The most ${base} compared to all others (${cleanDef.charAt(0).toLowerCase() + cleanDef.slice(1).replace(/\.$/, '')}).`;
      }
      if (inflectionInfo.formType === 'past') {
        return `Past tense of "${base}": ${cleanDef.charAt(0).toLowerCase() + cleanDef.slice(1)}`;
      }
      if (inflectionInfo.formType === 'ing') {
        return `Action form of "${base}": ${cleanDef.charAt(0).toLowerCase() + cleanDef.slice(1)}`;
      }
      return cleanDef;
    }

    async function translateToBahasaMelayu(text) {
      if (!text) return null;
      try {
        const resp = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ms`);
        if (!resp.ok) return null;
        const json = await resp.json();
        const translated = json && json.responseData && json.responseData.translatedText;
        if (!translated || !isChildSafeText(translated)) return null;
        if (translated.trim().toLowerCase() === text.trim().toLowerCase()) return null;
        return translated.trim();
      } catch (e) {
        return null;
      }
    }

    function extractTargetWordFromQuery(rawQuery) {
      let cleaned = (rawQuery || '').trim().toLowerCase();
      cleaned = cleaned.replace(/[?!.,'"]+$/g, '').trim();
      const patterns = [
        /^what\s+does\s+(.+?)\s+mean$/,
        /^what\s+is\s+the\s+meaning\s+of\s+(.+)$/,
        /^meaning\s+of\s+(.+)$/,
        /^define\s+(.+)$/,
        /^what\s+is\s+a\s+(.+)$/,
        /^what\s+is\s+an\s+(.+)$/,
        /^what\s+is\s+(.+)$/
      ];
      for (const p of patterns) {
        const m = cleaned.match(p);
        if (m && m[1]) {
          cleaned = m[1].trim();
          break;
        }
      }
      return cleaned;
    }

    function selectContextualSense(entry, targetLower) {
      if (!entry || !Array.isArray(entry.senses) || entry.senses.length < 2) {
        return entry;
      }
      const pupilDraft = `${appState.composer.body || ''} ${appState.composer.salutation || ''}`.toLowerCase();
      if (targetLower === 'sounds' || targetLower === 'sound') {
        if (/\b(hear|heard|loud|quiet|funny|strange|weird|noise|noises|many)\s+sounds?\b/.test(pupilDraft)) {
          return { ...entry, ...entry.senses[1], senses: entry.senses, activeSenseKey: entry.senses[1].key };
        }
        return { ...entry, ...entry.senses[0], senses: entry.senses, activeSenseKey: entry.senses[0].key };
      }
      if (targetLower === 'cold') {
        if (/\b(water|drink|ice|icy|weather|wind|food|sweets)\b/.test(pupilDraft) && !/\bhave\s+a\s+cold\b/.test(pupilDraft)) {
          return { ...entry, ...entry.senses[1], senses: entry.senses, activeSenseKey: entry.senses[1].key };
        }
        return { ...entry, ...entry.senses[0], senses: entry.senses, activeSenseKey: entry.senses[0].key };
      }
      if (targetLower === 'rest') {
        if (/\b(plenty\s+of|need|get\s+some|a\s+good)\s+rest\b/.test(pupilDraft)) {
          return { ...entry, ...entry.senses[1], senses: entry.senses, activeSenseKey: entry.senses[1].key };
        }
        return { ...entry, ...entry.senses[0], senses: entry.senses, activeSenseKey: entry.senses[0].key };
      }
      return { ...entry, ...entry.senses[0], senses: entry.senses, activeSenseKey: entry.senses[0].key };
    }

    function switchWordBuddySense(messageId, senseKey) {
      const msg = appState.wordBuddy.messages.find(m => m.id === messageId);
      if (!msg || !msg.entry || !Array.isArray(msg.entry.senses)) return;
      const chosen = msg.entry.senses.find(s => s.key === senseKey);
      if (!chosen) return;
      msg.entry = {
        ...msg.entry,
        ...chosen,
        activeSenseKey: chosen.key
      };
      renderWordBuddy();
    }

    async function handleWordBuddyLookup(rawInput) {
      const raw = (rawInput || '').trim();
      if (!raw) return;

      appState.wordBuddy.messages.push({
        id: 'wb_u_' + Date.now(),
        sender: 'pupil',
        text: raw
      });

      const targetWord = extractTargetWordFromQuery(raw);

      if (!isChildSafeText(targetWord)) {
        appState.wordBuddy.messages.push({
          id: 'wb_b_' + Date.now(),
          sender: 'bot',
          entry: {
            word: 'School Safe Filter',
            pos: 'kid-friendly helper',
            bm: null,
            def: 'Word Buddy is a Year 4 school dictionary and only shows kid-friendly words! Try searching words like "cheaper", "cinema", "sounds", or "celebration".',
            example: 'We use friendly words when writing to our pen pals.',
            exampleBm: 'Kami menggunakan perkataan yang mesra semasa menulis kepada sahabat pena.',
            iconType: null
          }
        });
        renderWordBuddy();
        scrollWordBuddyToBottom();
        return;
      }

      if (WORD_BUDDY_DICTIONARY[targetWord]) {
        const contextualEntry = selectContextualSense(WORD_BUDDY_DICTIONARY[targetWord], targetWord);
        appState.wordBuddy.messages.push({
          id: 'wb_b_' + Date.now(),
          sender: 'bot',
          entry: contextualEntry
        });
        renderWordBuddy();
        scrollWordBuddyToBottom();
        return;
      }

      if (appState.wordBuddyCache && appState.wordBuddyCache[targetWord]) {
        appState.wordBuddy.messages.push({
          id: 'wb_b_' + Date.now(),
          sender: 'bot',
          entry: appState.wordBuddyCache[targetWord]
        });
        renderWordBuddy();
        scrollWordBuddyToBottom();
        return;
      }

      const loadingId = 'wb_load_' + Date.now();
      appState.wordBuddy.messages.push({
        id: loadingId,
        sender: 'bot',
        loading: true,
        queryWord: targetWord
      });
      renderWordBuddy();
      scrollWordBuddyToBottom();

      const inflection = analyzeWordInflection(targetWord);
      const lookupCandidates = [...new Set([
        targetWord,
        inflection.base,
        inflection.baseAlt
      ].filter(Boolean))];

      let fetchedEntry = null;
      for (const candidate of lookupCandidates) {
        try {
          const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(candidate)}`);
          if (resp.ok) {
            const data = await resp.json();
            if (Array.isArray(data) && data[0] && Array.isArray(data[0].meanings)) {
              for (const meaning of data[0].meanings) {
                const safeDefObj = (meaning.definitions || []).find(d =>
                  d && d.definition && isChildSafeText(d.definition) && !/\b(vulgar|slang|offensive|taboo|archaic|obsolete)\b/i.test(d.definition)
                );
                if (safeDefObj) {
                  const isExactMatch = candidate === targetWord;
                  const basePartOfSpeech = meaning.partOfSpeech || 'word';
                  const displayPos = (!isExactMatch && inflection.posLabel) ? inflection.posLabel : basePartOfSpeech;
                  const adaptedDef = isExactMatch
                    ? safeDefObj.definition
                    : adaptDefinitionForInflection(safeDefObj.definition, targetWord, inflection);

                  appState.verifiedWords[targetWord] = 'valid';
                  appState.verifiedWords[candidate] = 'valid';
                  saveState();

                  let chosenExample = null;
                  const allDefs = meaning.definitions || [];
                  for (const dItem of allDefs) {
                    if (
                      dItem &&
                      dItem.example &&
                      isChildSafeText(dItem.example) &&
                      dItem.example.split(/\s+/).length >= 4 &&
                      dItem.example.split(/\s+/).length <= 12 &&
                      new RegExp(`\\b${escapeRegExp(targetWord)}\\b`, 'i').test(dItem.example)
                    ) {
                      const cleanEx = dItem.example.trim();
                      chosenExample = cleanEx.charAt(0).toUpperCase() + cleanEx.slice(1);
                      if (!/[.!?]$/.test(chosenExample)) chosenExample += '.';
                      break;
                    }
                  }

                  if (!chosenExample) {
                    chosenExample = buildKidSafeExample(targetWord, displayPos, adaptedDef, inflection);
                  }

                  const [bmWord, bmExample] = await Promise.all([
                    translateToBahasaMelayu(targetWord),
                    translateToBahasaMelayu(chosenExample)
                  ]);

                  fetchedEntry = {
                    word: targetWord,
                    pos: displayPos,
                    bm: bmWord,
                    def: adaptedDef,
                    example: chosenExample,
                    exampleBm: bmExample,
                    iconType: null
                  };
                  break;
                }
              }
              if (fetchedEntry) break;
            }
          }
        } catch (err) {}
      }

      appState.wordBuddy.messages = appState.wordBuddy.messages.filter(m => m.id !== loadingId);

      if (fetchedEntry) {
        appState.wordBuddyCache[targetWord] = fetchedEntry;
        saveState();
        appState.wordBuddy.messages.push({
          id: 'wb_b_' + Date.now(),
          sender: 'bot',
          entry: fetchedEntry
        });
      } else {
        const knownPool = new Set([
          ...Object.keys(WORD_BUDDY_DICTIONARY),
          ...YEAR4_LEXICON
        ]);
        const suggestedWord = COMMON_TYPOS[targetWord] || findClosestLexiconWord(targetWord, knownPool);
        appState.wordBuddy.messages.push({
          id: 'wb_b_' + Date.now(),
          sender: 'bot',
          notFound: true,
          queryWord: targetWord,
          suggestion: (suggestedWord && suggestedWord.toLowerCase() !== targetWord) ? suggestedWord : null
        });
      }

      renderWordBuddy();
      scrollWordBuddyToBottom();
    }

        .replace(/"/g, '&quot;')

    function isSpeechSupported() {
      return typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
    }

    function speakBritishEnglish(text) {
      if (!isSpeechSupported()) {
        showToast('Audio pronunciation is unavailable in this browser.', 'amber');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const ukVoice =
        voices.find(v => v.lang === 'en-GB' && v.name.includes('Google')) ||
        voices.find(v => v.lang === 'en-GB') ||
        voices.find(v => v.lang.startsWith('en'));
      if (ukVoice) utterance.voice = ukVoice;
      utterance.lang = 'en-GB';
      utterance.rate = 0.92;
      utterance.pitch = 1.03;

      appState.isSpeaking = true;
      renderApp();

      utterance.onend = () => {
        appState.isSpeaking = false;
        renderApp();
      };
      utterance.onerror = () => {
        appState.isSpeaking = false;
        renderApp();
      };
      window.speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      if (isSpeechSupported()) {
        window.speechSynthesis.cancel();
      }
      appState.isSpeaking = false;
      renderApp();
    }

    if (isSpeechSupported()) {
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#4f46e5', '#0ea5e9', '#10b981', '#f59e0b', '#ec4899', '#facc15'];
      const particles = Array.from({ length: 100 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        w: Math.random() * 9 + 6,
        h: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        vy: Math.random() * 3.4 + 2.4,
        vx: (Math.random() - 0.5) * 2.8,
        rot: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 8
      }));

      let frame = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.vy;
          p.x += p.vx;
          p.rot += p.vRot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        frame++;
        if (frame < 135) {
          requestAnimationFrame(draw);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(draw);
    }

    function showToast(message, tone = 'indigo') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const tones = {
        indigo: 'bg-indigo-600 text-white border-indigo-400',
        emerald: 'bg-emerald-600 text-white border-emerald-400',
        amber: 'bg-amber-500 text-white border-amber-300'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg border font-semibold text-sm flex items-center gap-2.5 animate-pop ${tones[tone] || tones.indigo}`;
      el.innerHTML = `<span>✨</span><span>${escapeHTML(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3000);
    }

    function isKnownValidWord(lowerWord, extraValidSet) {
      if (!lowerWord || lowerWord.length < 1) return true;
      if (YEAR4_LEXICON.has(lowerWord)) return true;
      if (MALAYSIAN_TERMS.has(lowerWord)) return true;
      if (VALID_AMERICAN_SPELLING.has(lowerWord)) return true;
      if (extraValidSet && extraValidSet.has(lowerWord)) return true;
      if (appState.verifiedWords[lowerWord] === 'valid' || appState.verifiedWords[lowerWord] === true) return true;
      if (WORD_BUDDY_DICTIONARY[lowerWord]) return true;
      return false;
    }

    function isValidEnglishMorphology(lowerWord, extraValidSet) {
      if (isKnownValidWord(lowerWord, extraValidSet)) return true;

      const rules = [
        { suffix: 'ies', repl: 'y' },
        { suffix: 'ied', repl: 'y' },
        { suffix: 'ier', repl: 'y' },
        { suffix: 'iest', repl: 'y' },
        { suffix: 'ily', repl: 'y' },
        { suffix: 'es', repl: '' },
        { suffix: 's', repl: '' },
        { suffix: 'ed', repl: '' },
        { suffix: 'ed', repl: 'e' },
        { suffix: 'ing', repl: '' },
        { suffix: 'ing', repl: 'e' },
        { suffix: 'er', repl: '' },
        { suffix: 'er', repl: 'e' },
        { suffix: 'est', repl: '' },
        { suffix: 'est', repl: 'e' },
        { suffix: 'ly', repl: '' },
        { suffix: 'ful', repl: '' },
        { suffix: 'less', repl: '' },
        { suffix: 'ness', repl: '' },
        { suffix: 'ment', repl: '' },
        { suffix: 'able', repl: '' },
        { suffix: 'able', repl: 'e' }
      ];

      for (const r of rules) {
        if (lowerWord.endsWith(r.suffix) && lowerWord.length > r.suffix.length + 2) {
          const stem = lowerWord.slice(0, -r.suffix.length) + r.repl;
          if (isKnownValidWord(stem, extraValidSet)) return true;
          if (stem.length >= 4 && stem[stem.length - 1] === stem[stem.length - 2]) {
            if (isKnownValidWord(stem.slice(0, -1), extraValidSet)) return true;
          }
        }
      }

      if ((lowerWord.startsWith('un') || lowerWord.startsWith('re')) && lowerWord.length > 5) {
        if (isKnownValidWord(lowerWord.slice(2), extraValidSet)) return true;
      }

      return false;
    }

    function levenshteinDistance(a, b) {
      const m = a.length;
      const n = b.length;
      if (Math.abs(m - n) > 2) return 3;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    function findClosestLexiconWord(lowerWord, extraValidSet) {
      if (lowerWord.length < 3) return null;
      let best = null;
      let bestDist = 3;
      const maxAllowed = lowerWord.length >= 5 ? 2 : 1;

      const checkCandidate = (cand) => {
        if (Math.abs(cand.length - lowerWord.length) > maxAllowed) return;
        const d = levenshteinDistance(lowerWord, cand);
        if (d <= maxAllowed && d < bestDist) {
          bestDist = d;
          best = cand;
        }
      };

      if (extraValidSet) {
        for (const w of extraValidSet) checkCandidate(w);
      }
      for (const w of YEAR4_LEXICON) {
        checkCandidate(w);
        if (bestDist === 1 && best && best[0] === lowerWord[0]) break;
      }
      return best;
    }

    async function verifyAdvancedWordsOnline(textsToScan, extraValidWords) {
      const unknownCandidates = new Set();
      const tokenRegex = /[A-Za-z]+(?:'[A-Za-z]+)?/g;

      textsToScan.forEach(txt => {
        if (!txt) return;
        let m;
        while ((m = tokenRegex.exec(txt)) !== null) {
          const raw = m[0];
          const lower = raw.toLowerCase();
          if (/^[A-Z]/.test(raw)) continue;
          if (COMMON_TYPOS[lower] || PROPER_CAPITALIZATION[lower]) continue;
          if (isValidEnglishMorphology(lower, extraValidWords)) continue;
          if (appState.verifiedWords[lower] === 'valid' || appState.verifiedWords[lower] === 'not_found') continue;
          if (lower.length >= 3 && lower.length <= 24) {
            unknownCandidates.add(lower);
          }
        }
      });

      if (unknownCandidates.size === 0) return;

      let stateUpdated = false;
      await Promise.all([...unknownCandidates].slice(0, 10).map(async (word) => {
        const inflection = analyzeWordInflection(word);
        const candidates = [...new Set([word, inflection.base, inflection.baseAlt].filter(Boolean))];
        let foundValid = false;
        let confirmedNotFound = false;

        for (const cand of candidates) {
          try {
            const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(cand)}`);
            if (resp.ok) {
              appState.verifiedWords[word] = 'valid';
              appState.verifiedWords[cand] = 'valid';
              foundValid = true;
              stateUpdated = true;
              break;
            } else if (resp.status === 404) {
              confirmedNotFound = true;
            }
          } catch (e) {}
        }

        if (!foundValid) {
          appState.verifiedWords[word] = confirmedNotFound ? 'not_found' : 'uncertain';
          stateUpdated = true;
        }
      }));

      if (stateUpdated) {
        saveState();
      }
    }

    function checkTextSpellingAndTypos(text, fieldLabel, extraValidWords, confirmedErrors, optionalTips) {
      if (!text) return;
      const tokenRegex = /[A-Za-z]+(?:'[A-Za-z]+)?/g;
      let match;
      const reportedWords = new Set();

      while ((match = tokenRegex.exec(text)) !== null) {
        const rawWord = match[0];
        const lower = rawWord.toLowerCase();
        const isCapitalized = /^[A-Z]/.test(rawWord);

        if (reportedWords.has(lower)) continue;

        if (COMMON_TYPOS[lower]) {
          reportedWords.add(lower);
          confirmedErrors.push({
            priority: 1,
            snippet: rawWord,
            message: `Spelling (${fieldLabel}): Write "${COMMON_TYPOS[lower]}" instead of "${rawWord}".`
          });
          continue;
        }

        if (!isCapitalized && PROPER_CAPITALIZATION[lower]) {
          reportedWords.add(lower);
          confirmedErrors.push({
            priority: 2,
            snippet: rawWord,
            message: `Capital Letter (${fieldLabel}): Capitalise "${PROPER_CAPITALIZATION[lower]}" instead of "${rawWord}".`
          });
          continue;
        }

        if (isCapitalized) continue;
        if (isValidEnglishMorphology(lower, extraValidWords)) continue;

        reportedWords.add(lower);
        const status = appState.verifiedWords[lower];
        const closest = findClosestLexiconWord(lower, extraValidWords);

        if (status === 'not_found' && closest) {
          confirmedErrors.push({
            priority: 1,
            snippet: rawWord,
            message: `Spelling (${fieldLabel}): Check "${rawWord}" — did you mean "${closest}"?`
          });
        } else {
          optionalTips.push(
            closest
              ? `Double-check "${rawWord}" in your ${fieldLabel} (did you mean "${closest}"?).`
              : `Double-check the spelling of "${rawWord}" in your ${fieldLabel} if it is not a Malaysian word or name.`
          );
        }
      }
    }

        const hasModal = /\b(should|shouldn't|should not)\b/.test(text);

            'You started giving advice—use "should" to tell a friend what to do when they feel sick (for example, "They should rest and see a doctor.").');

          addResult(2, 'missing',

    function validateEmailBeforeSend(composer, pupil, topic, roundData) {
      const confirmedErrors = [];
      const optionalTips = [];
      const subject = composer.subject.trim();
      const salutation = composer.salutation.trim();
      const body = composer.body.trim();
      const closing = composer.closing.trim();
      const penpalLower = topic.penpalName.toLowerCase();
      const pupilLower = pupil.name.toLowerCase();

      const extraValidWords = new Set([penpalLower, pupilLower]);
      pupilLower.split(/\s+/).forEach(part => { if (part) extraValidWords.add(part); });
      Object.values(roundData.scaffold.wordBank).forEach(arr => {
        arr.forEach(phrase => {
          phrase.toLowerCase().split(/\s+/).forEach(w => {
            const clean = w.replace(/[^a-z']/g, '');
            if (clean) extraValidWords.add(clean);
          });
        });
      });

      const autoSubject = roundData.subject.startsWith('Re:') ? roundData.subject : `Re: ${roundData.subject}`;
      if (!subject || subject.length < 3 || subject.includes('...')) {
        confirmedErrors.push({
          priority: 1,
          snippet: subject || '(Empty Subject)',
          message: 'Email Header: Please write a clear Subject line without unfinished "..." dots.'
        });
      } else if (composer.round !== 2 && subject !== autoSubject) {
        checkTextSpellingAndTypos(subject, 'Subject', extraValidWords, confirmedErrors, optionalTips);
      }

      if (!salutation) {
        confirmedErrors.push({
          priority: 1,
          snippet: '(Empty Salutation)',
          message: `Salutation: Write a friendly greeting at the top, such as "Hi ${topic.penpalName}, how are you? I hope you are doing well."`
        });
      } else if (salutation.includes('...')) {
        confirmedErrors.push({
          priority: 1,
          snippet: salutation,
          message: 'Salutation: Replace "..." with your complete greeting.'
        });
      } else {
        const salLower = salutation.toLowerCase();
        const hasGreeting = /\b(dear|hi|hello|hey)\b/.test(salLower);
        const hasPenpal = salLower.includes(penpalLower);
        const hasPunct = /[,!.?]$/.test(salutation);
        if (!hasGreeting || !hasPenpal) {
          confirmedErrors.push({
            priority: 1,
            snippet: salutation,
            message: `Salutation: Include a greeting and ${topic.penpalName}'s name (e.g. "Hi ${topic.penpalName}, how are you? I hope you are doing well.").`
          });
        } else if (!hasPunct) {
          confirmedErrors.push({
            priority: 2,
            snippet: salutation,
            message: 'Salutation: Put a comma, exclamation mark, or full stop at the end of your greeting.'
          });
        }
        checkTextSpellingAndTypos(salutation, 'Salutation', extraValidWords, confirmedErrors, optionalTips);
      }

      const questionStatuses = evaluateQuestionsByMeaning(topic.id, composer.round, `${salutation} ${body}`, roundData);

      if (!body) {
        confirmedErrors.push({
          priority: 1,
          snippet: '(Empty Main Body)',
          message: `Main Body: Your message box is empty! Answer ${topic.penpalName}'s questions in complete sentences.`
        });
      } else {
        if (body.includes('...') || body.includes('___') || /\[[^\]]*\]/.test(body)) {
          confirmedErrors.push({
            priority: 1,
            snippet: '...',
            message: 'Unfinished Starter: Replace "...", "___", or brackets [ ] with your own complete words.'
          });
        }

        const missingSpaceMatch = body.match(/([a-zA-Z0-9])([.!?])([A-Za-z])/);
        if (missingSpaceMatch) {
          confirmedErrors.push({
            priority: 2,
            snippet: missingSpaceMatch[0],
            message: `Spacing: Put a space after "${missingSpaceMatch[2]}" before starting the next sentence.`
          });
        }

        const repeatedWordMatch = body.match(/\b([a-zA-Z]+)\s+\1\b/i);
        if (repeatedWordMatch) {
          confirmedErrors.push({
            priority: 2,
            snippet: repeatedWordMatch[0],
            message: `Repeated Word: You wrote "${repeatedWordMatch[1]}" twice in a row.`
          });
        }

        checkTextSpellingAndTypos(body, 'Main Body', extraValidWords, confirmedErrors, optionalTips);

        const sentences = body
          .split(/(?<=[.!?])\s+|\n+/)
          .map(s => s.trim())
          .filter(Boolean);

        sentences.forEach((sent, idx) => {
          const num = idx + 1;
          if (/^[a-z]/.test(sent)) {
            confirmedErrors.push({
              priority: 2,
              snippet: sent.slice(0, 28),
              message: `Capital Letter (Sentence ${num}): Start "${sent.slice(0, 24)}..." with a capital letter.`
            });
          }
          if (!/[.!?]$/.test(sent)) {
            confirmedErrors.push({
              priority: 2,
              snippet: sent.slice(-24),
              message: `End Punctuation (Sentence ${num}): End "${sent.slice(0, 28)}" with a full stop (.), exclamation mark (!), or question mark (?).`
            });
          }
          if (/\bi\b/.test(sent)) {
            confirmedErrors.push({
              priority: 2,
              snippet: sent,
              message: `Capital "I" (Sentence ${num}): Always write the pronoun "I" as a capital letter.`
            });
          }
          if (/^because\b/i.test(sent)) {
            confirmedErrors.push({
              priority: 1,
              snippet: sent,
              message: `Sentence Fragment (Sentence ${num}): Join "because" to the main sentence instead of starting a sentence with it (e.g. "I like Friday because we have Art.").`
            });
          }

          const withoutPunct = sent.replace(/[.!?]+$/, '').trim();
          const words = withoutPunct.split(/\s+/);
          const lastWord = (words[words.length - 1] || '').toLowerCase();
          const danglingWords = [
            'because', 'and', 'or', 'but', 'so', 'when', 'if',
            'is', 'am', 'are', 'was', 'were', 'have', 'has',
            'to', 'in', 'at', 'on', 'by', 'with', 'from', 'of', 'for',
            'a', 'an', 'the', 'my', 'your', 'his', 'her', 'our', 'their',
            'should', "shouldn't"
          ];
          if (words.length <= 2 || danglingWords.includes(lastWord)) {
            confirmedErrors.push({
              priority: 1,
              snippet: sent,
              message: `Incomplete Sentence (Sentence ${num}): "${sent}" needs a few more words to complete your idea.`
            });
          }
        });

        const grammarRules = [
          {
            priority: 1,
            regex: /\bi\s+is\b/i,
            msg: 'Subject–Verb Agreement: Use "I am" instead of "I is".'
          },
          {
            priority: 1,
            regex: /\bi\s+are\b/i,
            msg: 'Subject–Verb Agreement: Use "I am" instead of "I are".'
          },
          {
            priority: 1,
            regex: /\bi\s+has\b/i,
            msg: 'Subject–Verb Agreement: Use "I have" instead of "I has".'
          },
          {
            priority: 1,
            regex: /\b(i|you|we|they)\s+(goes|likes|loves|plays|eats|drinks|visits|lives|celebrates|helps|rests|feels|wears|reads|writes|studies|cooks|cleans|watches|sounds)\b/i,
            msg: 'Subject–Verb Agreement: Do not add "-s" to the verb after "I", "you", "we", or "they" (e.g. write "I like", not "I likes").'
          },
          {
            priority: 1,
            regex: /\b(he|she|it|that|this)\s+(sound|look|seem|feel|like|love|go|live|eat|drink|play|help|rest)\b/i,
            msg: 'Subject–Verb Agreement: Add "-s" or "-es" to the verb after "he", "she", "it", or "that" (e.g. "That sounds fun!", "She likes...").'
          },
          {
            priority: 1,
            regex: /\b(he|she)\s+(am|are)\b/i,
            msg: 'Subject–Verb Agreement: Use "He is" or "She is" for one person.'
          },
          {
            priority: 1,
            regex: /\b(he|she|my\s+sister|my\s+brother|my\s+friend|my\s+mother|my\s+father)\s+have\b/i,
            msg: 'Subject–Verb Agreement: Use "has" (not "have") for one person (e.g. "My sister has a sore throat.").'
          },
          {
            priority: 1,
            regex: /\b(they|we)\s+(is|am)\b/i,
            msg: 'Subject–Verb Agreement: Use "They are" or "We are" for more than one person.'
          },
          {
            priority: 1,
            regex: /\b(they|we)\s+has\b/i,

          },

          {
            priority: 2,
            regex: /\ba\s+(apple|orange|egg|ice\s+cream|island|interesting|exciting|awesome|activity|occasion|earache|afternoon|evening)\b/i,
            msg: 'Article Check (a / an): Use "an" before words starting with a vowel sound (e.g. "an interesting place").'
          },
          {
            priority: 2,
            regex: /\ban\s+(beach|cold|fever|book|friend|place|day|school|house|family|doctor|medicine|celebration|healthy|beautiful)\b/i,
            msg: 'Article Check (a / an): Use "a" before words starting with a consonant sound (e.g. "a cold", "a beach").'
          }
        ];

        grammarRules.forEach(rule => {
          const m = body.match(rule.regex);
          if (m) {
            confirmedErrors.push({
              priority: rule.priority,
              snippet: m[0].trim(),
              message: rule.msg
            });
          }
        });
      }

      if (!closing) {
        confirmedErrors.push({
          priority: 1,
          snippet: '(Empty Closing)',
          message: `Closing & Signature: Add a friendly closing and your name at the bottom (e.g. "Your friend,\\n${pupil.name}").`
        });
      } else if (closing.includes('...')) {
        confirmedErrors.push({
          priority: 1,
          snippet: closing,
          message: 'Closing & Signature: Replace "..." with your closing phrase and your first name.'
        });
      } else {
        const hasClosingPhrase = /\b(friend|pen pal|wishes|regards|sincerely|cheers|love)\b/i.test(closing);
        const hasPupilSignature = closing.toLowerCase().includes(pupilLower);
        if (!hasClosingPhrase) {
          confirmedErrors.push({
            priority: 2,
            snippet: closing,
            message: 'Closing Phrase: Include a friendly closing line like "Your friend," or "Warm wishes," before your name.'
          });
        }
        if (!hasPupilSignature) {
          confirmedErrors.push({
            priority: 2,
            snippet: closing,
            message: `Signature: Sign your first name "${pupil.name}" at the bottom of your closing.`
          });
        }
        checkTextSpellingAndTypos(closing, 'Closing', extraValidWords, confirmedErrors, optionalTips);
      }

      const seenMsgs = new Set();
      const uniqueConfirmed = confirmedErrors
        .sort((a, b) => a.priority - b.priority)
        .filter(item => {
          if (seenMsgs.has(item.message)) return false;
          seenMsgs.add(item.message);
          return true;
        })
        .slice(0, 3);

      const uniqueOptional = [...new Set(optionalTips)].slice(0, 3);

      return {
        confirmedErrors: uniqueConfirmed,
        optionalTips: uniqueOptional,
        questionStatuses
      };
    }

      if (!hasBlockingIssues && !hasOptionalTips) {

        html += `
          <div class="rounded-3xl bg-amber-50/90 border-2 border-amber-400 p-5 space-y-3">

            <div class="space-y-2">

                  ? '<span class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-xs font-extrabold shrink-0">✅ Answered</span>'
                  : q.status === 'partly'

                  <div class="p-3 rounded-2xl bg-white border border-amber-200/80 space-y-1">

                      <span class="text-xs font-extrabold text-slate-800">${q.qId}: ${escapeHTML(q.question)}</span>

            <div class="font-display font-extrabold text-rose-700 text-base flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span>🛑</span>
                <span>Fix ${comp.errors.length} confirmed mistake(s) below before sending:</span>
              </div>
              <span class="px-2.5 py-0.5 rounded-full bg-rose-600 text-white text-xs font-extrabold">Revise & Send</span>
            </div>
            <div class="space-y-2">
              ${comp.errors.map((err, i) => `
                <div class="flex items-start gap-3 p-3 rounded-2xl bg-white border border-rose-200 text-sm font-semibold text-rose-950">
                  <span class="w-6 h-6 rounded-full bg-rose-600 text-white font-extrabold text-xs flex items-center justify-center shrink-0 mt-0.5">${i + 1}</span>

                    <div>${escapeHTML(err.message)}</div>

      if (hasOptionalTips) {

    async function handleSendEmail() {
      if (appState.isValidatingSend) return;
      const pupil = getCurrentPupil();
      const topic = TOPICS.find(t => t.id === appState.composer.topicId);
      if (!pupil || !topic) return;
      const round = appState.composer.round;
      const roundData = round === 2 ? topic.round2 : topic.round1;

      appState.isValidatingSend = true;
      const sendBtn = document.getElementById('send-email-btn');
      if (sendBtn) {
        sendBtn.disabled = true;
        sendBtn.innerHTML = `<span>⏳</span><span>Checking...</span>`;
      }

      const extraValidWords = new Set([topic.penpalName.toLowerCase(), pupil.name.toLowerCase()]);
      pupil.name.toLowerCase().split(/\s+/).forEach(part => { if (part) extraValidWords.add(part); });
      Object.values(roundData.scaffold.wordBank).forEach(arr => {
        arr.forEach(phrase => {
          phrase.toLowerCase().split(/\s+/).forEach(w => {
            const clean = w.replace(/[^a-z']/g, '');
            if (clean) extraValidWords.add(clean);
          });
        });
      });

      await verifyAdvancedWordsOnline(
        [
          round === 2 ? '' : appState.composer.subject,
          appState.composer.salutation,
          appState.composer.body,
          appState.composer.closing
        ],
        extraValidWords
      );

      appState.isValidatingSend = false;
      if (sendBtn) {
        sendBtn.disabled = false;
        sendBtn.innerHTML = `<span>✉️</span><span>Send Email</span>`;
      }

      const validation = validateEmailBeforeSend(appState.composer, pupil, topic, roundData);
      const incompleteQuestions = validation.questionStatuses.filter(q => q.status !== 'answered');

      if (validation.confirmedErrors.length > 0 || incompleteQuestions.length > 0) {
        appState.composer.errors = validation.confirmedErrors;
        appState.composer.optionalTips = validation.optionalTips;
        appState.composer.questionStatuses = validation.questionStatuses;
        appState.composer.attemptedSend = true;
        appState.composer.hadErrorsBeforeSend = true;
        renderPostSendFeedbackUnderWritingBox();
        const errBox = document.getElementById('validation-feedback-box');
        if (errBox) {
          errBox.classList.remove('animate-shake');
          void errBox.offsetWidth;
          errBox.classList.add('animate-shake');
          errBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        return;
      }

      const firstTryClean = !appState.composer.hadErrorsBeforeSend;
      const baseXP = round === 2 ? 75 : 50;
      const bonusXP = firstTryClean ? 15 : 0;
      const earnedXP = baseXP + bonusXP;

      pupil.xp = (pupil.xp || 0) + earnedXP;

      const currentMail = pupil.inbox.find(e => e.topicId === topic.id && e.round === round);
      if (currentMail) {
        currentMail.replied = true;
        currentMail.unread = false;
      }

      pupil.sent.unshift({
        id: 'sent_' + Date.now(),
        topicId: topic.id,
        topicLabel: topic.topicLabel,
        round,
        toName: topic.penpalName,
        toEmail: topic.email,
        subject: appState.composer.subject.trim(),
        salutation: appState.composer.salutation.trim(),
        body: appState.composer.body.trim(),
        closing: appState.composer.closing.trim(),
        sentAt: new Date().toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' }) + ', ' +
                new Date().toLocaleDateString('en-MY', { day: '2-digit', month: 'short' }),
        xpEarned: earnedXP
      });

      const newBadges = [];
      function unlockBadge(badgeId) {
        if (!pupil.badges.includes(badgeId)) {
          pupil.badges.push(badgeId);
          const found = BADGES_CATALOG.find(b => b.id === badgeId);
          if (found) newBadges.push(found);
        }
      }
      unlockBadge('first_email');
      if (firstTryClean) unlockBadge('grammar_star');

      let round2Delivered = false;
      const r2Id = `${topic.id}_r2`;

      if (round === 1) {
        pupil.topicProgress[topic.id].round1Done = true;
        pupil.topicProgress[topic.id].round1ReplyBody = appState.composer.body.trim();

        if (!pupil.inbox.some(e => e.id === r2Id)) {
          const reaction = buildAdaptiveRound2Reaction(topic.id, appState.composer.body.trim());
          pupil.inbox.unshift({
            id: r2Id,
            topicId: topic.id,
            round: 2,
            penpalName: topic.penpalName,
            email: topic.email,
            city: topic.city,
            topicLabel: topic.topicLabel,
            subject: topic.round2.subject,
            time: topic.round2.time,
            salutation: topic.round2.salutation,
            storyParagraph: `${reaction} ${topic.round2.defaultStoryParagraph}`.trim(),
            questions: topic.round2.questions,
            closingLine1: topic.round2.closingLine1,
            closingLine2: topic.round2.closingLine2,
            unread: true,
            replied: false
          });
          round2Delivered = true;
        }
      } else {
        pupil.topicProgress[topic.id].round2Done = true;
        unlockBadge(topic.badge.id);
        if (getCompletedTopicsCount(pupil) === TOPICS.length) {
          unlockBadge('super_penpal');
        }
      }

      appState.composer.active = false;
      appState.view = 'inbox';
      appState.inboxFilter = 'all';
      appState.mobileReadingOpen = false;
      appState.selectedEmailId = round2Delivered ? r2Id : (pupil.inbox[0] ? pupil.inbox[0].id : null);
      appState.celebrationBanner = {
        penpalName: topic.penpalName,
        topicId: topic.id,
        topicLabel: topic.topicLabel,
        round,
        earnedXP,
        firstTryClean,
        round2Delivered,
        r2Id,
        newBadges
      };

      saveState();
      triggerConfetti();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateLiveCounters() {
      const el = document.getElementById('live-counter');
      if (!el) return;
      const body = appState.composer.body;
      const wordCount = body.trim() ? body.trim().split(/\s+/).length : 0;
      const sentenceCount = body.trim()
        ? body.trim().split(/(?<=[.!?])\s+|\n+/).filter(Boolean).length
        : 0;
      el.textContent = `${sentenceCount} sentence(s) • ${wordCount} word(s)`;
    }

                  <div class="text-[11px] font-bold text-amber-950/80">Picture Dictionary & Bahasa Melayu</div>
                </div>
              </div>
              <button onclick="appState.wordBuddy.open=false; renderWordBuddy();"
                aria-label="Close Word Buddy"
                class="w-8 h-8 rounded-full bg-white/50 hover:bg-white/80 font-extrabold text-slate-900 text-sm">
                ✕
              </button>

            <div id="word-buddy-messages" class="p-4 overflow-y-auto space-y-3.5 flex-1 bg-slate-50/70 max-h-[400px]">
              ${wb.messages.map(msg => {
                if (msg.sender === 'pupil') {
                  return `
                    <div class="flex justify-end">
                      <div class="px-4 py-2 rounded-2xl rounded-br-sm bg-indigo-600 text-white text-sm font-semibold max-w-[80%]">

                      </div>

                        Type <strong>any English word</strong> (including forms like <em>cheaper</em>, <em>visited</em>, or <em>sounds</em>), and I will show its <strong>meaning</strong>, <strong>Bahasa Melayu translation</strong>, <strong>example sentence</strong>, and <strong>UK audio</strong>!

                      ${canSpeak ? `
                        <button type="button" onclick="speakBritishEnglish(${toInlineJsArg(entry.word)})"
                          class="px-3 py-1 rounded-full bg-sky-100 hover:bg-sky-200 text-sky-900 text-xs font-extrabold shrink-0 transition">

                    <div class="space-y-1 text-xs sm:text-sm text-slate-700">
                      <p class="leading-snug">
                        <strong class="text-slate-900">Meaning:</strong> ${escapeHTML(entry.def)}

                      ${entry.bm ? `

                          <strong>Bahasa Melayu:</strong> ${escapeHTML(entry.bm)}
                        </p>
                      ` : ''}
                    </div>

                    <div class="p-3 rounded-xl bg-amber-50/85 border border-amber-200/70 space-y-1.5 text-xs text-slate-800">
                      <div class="flex items-start justify-between gap-2">
                        <p class="leading-relaxed">

                            class="px-2.5 py-1 rounded-lg bg-white hover:bg-amber-100 text-amber-950 border border-amber-200 text-[11px] font-extrabold shrink-0 transition">
                            🔊 Example
                          </button>
                        ` : ''}
                      </div>
                      ${entry.exampleBm ? `
                        <p class="text-slate-600 leading-relaxed">
                          <strong class="text-slate-800">Translation:</strong> ${escapeHTML(entry.exampleBm)}
                        </p>
                      ` : ''}
                    </div>

                    ${!canSpeak ? `
                      <div class="text-[11px] text-slate-500 font-semibold">
                        Audio pronunciation is unavailable in this browser.
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}

            <form onsubmit="event.preventDefault(); const inp = document.getElementById('wb-chat-input'); const val = inp.value; inp.value=''; handleWordBuddyLookup(val);"
              class="p-3 bg-white border-t border-slate-200 flex items-center gap-2">
              <input id="wb-chat-input" type="text"
                placeholder="Type any English word..."
                class="flex-1 px-3.5 py-2.5 rounded-2xl bg-slate-100 border border-slate-200 focus:bg-white focus:border-amber-400 focus:outline-none text-sm font-semibold" />
              <button type="submit"
                class="px-4 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm transition">
                Ask
              </button>
            </form>
          </div>
        `}
      `;
    }

    /*************************************************************************
     * 15. FIRST-TIME ONBOARDING & CHANGE NAME / CREATE NEW MODALS
     *************************************************************************/
    function renderModals() {
      if (!appState.modal) return '';

      if (appState.modal === 'onboarding') {
        const savedProfiles = Object.values(appState.profiles);
        const activePupil = getCurrentPupil();
        return `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
            <div class="bg-white rounded-3xl max-w-md w-full p-7 sm:p-8 shadow-2xl border border-slate-200/80 animate-pop space-y-5 relative">
              ${activePupil ? `
                <button type="button" onclick="appState.modal=null; renderApp();"
                  aria-label="Cancel and return"
                  class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm flex items-center justify-center">
                  ✕
                </button>
              ` : ''}

              <div class="text-center">
                <div class="mb-2 flex justify-center animate-float">
                  ${getBrandLogoSvg('h-24 sm:h-28 w-auto')}
                </div>
                <h2 class="font-display font-extrabold text-xl text-slate-900">e-Penpal: Write to me</h2>
                <p class="text-sm text-slate-600 mt-1">
                  Enter your first name and pick an animal avatar to open your mailbox.
                </p>
              </div>

              <form onsubmit="event.preventDefault(); const n = document.getElementById('onboard-name').value; const a = document.querySelector('input[name=onboard_avatar]:checked').value; handleCreatePupil(n, a);"
                class="space-y-4">
                <div>
                  <label for="onboard-name" class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">
                    Your First Name
                  </label>
                  <input id="onboard-name" type="text" required maxlength="24" autofocus
                    placeholder="e.g. Aisyah, Daniel, Mei Ling..."
                    class="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:outline-none text-base font-bold text-slate-900" />
                </div>

                <div>
                  <span class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">
                    Pick Your Avatar
                  </span>
                  <div class="grid grid-cols-6 gap-2">
                    ${PUPIL_AVATARS.map((av, idx) => `
                      <label class="cursor-pointer">
                        <input type="radio" name="onboard_avatar" value="${av}" ${idx === 0 ? 'checked' : ''} class="peer sr-only" />
                        <div class="h-12 rounded-2xl border-2 border-slate-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 flex items-center justify-center text-2xl transition hover:scale-105">
                          ${av}
                        </div>
                      </label>
                    `).join('')}
                  </div>
                </div>

                <div class="p-3.5 rounded-2xl bg-sky-50 border border-sky-100 text-xs text-sky-900 flex items-start gap-2">
                  <span>🛡️</span>
                  <span><strong>Online Safety Tip:</strong> Only use your first name. Never share your home address, phone number, or real email password!</span>
                </div>

                <button type="submit"
                  class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-display font-extrabold text-base shadow-sm transition">
                  Start Writing →
                </button>
              </form>

              ${savedProfiles.length > 0 ? `
                <div class="pt-4 border-t border-slate-100">
                  <div class="text-xs font-extrabold text-slate-400 mb-2">Or continue as a saved pupil:</div>
                  <div class="flex flex-wrap gap-2">
                    ${savedProfiles.map(p => `
                      <button type="button" onclick="handleSwitchPupil('${p.id}')"
                        class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-indigo-50 text-slate-800 hover:text-indigo-700 text-xs font-bold transition">
                        ${p.avatar} ${escapeHTML(p.name)}
                      </button>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }

      if (appState.modal === 'change_name') {
        const savedProfiles = Object.values(appState.profiles);
        return `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
            <div class="bg-white rounded-3xl max-w-md w-full p-7 shadow-2xl border border-slate-200 animate-pop space-y-5">
              <div class="flex items-center justify-between">
                <h2 class="font-display font-extrabold text-xl text-slate-900">Switch Pupil Mailbox</h2>
                <button onclick="appState.modal=null; renderApp();" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold text-slate-600">✕</button>
              </div>

              ${savedProfiles.length > 0 ? `
                <div class="space-y-2 max-h-56 overflow-y-auto">
                  ${savedProfiles.map(p => `
                    <button onclick="handleSwitchPupil('${p.id}')"
                      class="w-full p-3 rounded-2xl border flex items-center justify-between transition ${p.id === appState.currentPupilId ? 'bg-indigo-50 border-indigo-300' : 'bg-white border-slate-200 hover:bg-slate-50'}">
                      <div class="flex items-center gap-3">
                        <span class="text-2xl">${p.avatar}</span>
                        <div class="text-left">
                          <div class="font-extrabold text-sm text-slate-900">${escapeHTML(p.name)}</div>
                          <div class="text-xs text-slate-500">${p.xp} XP • Level ${getLevelFromXP(p.xp)}</div>
                        </div>
                      </div>
                      <span class="text-xs font-extrabold text-indigo-600">${p.id === appState.currentPupilId ? 'Current' : 'Open →'}</span>
                    </button>
                  `).join('')}
                </div>
              ` : ''}

              <div class="pt-4 border-t border-slate-100">
                <button type="button" onclick="startCreateNewProfile()"
                  class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-display font-extrabold text-sm shadow-sm transition flex items-center justify-center gap-2">
                  <span>✨</span>
                  <span>+ Create New Profile (Start from Beginning)</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      return '';
    }

    /*************************************************************************
     * 16. MAIN RENDERER & INITIALIZATION
     *************************************************************************/
    function renderApp() {
      const root = document.getElementById('app-root');
      const modalRoot = document.getElementById('modal-root');
      if (!root) return;

      const pupil = getCurrentPupil();

      const activeId = document.activeElement ? document.activeElement.id : null;
      const selStart = document.activeElement && typeof document.activeElement.selectionStart === 'number'
        ? document.activeElement.selectionStart
        : null;

      let mainContent = '';
      if (!pupil) {
        mainContent = `<main class="flex-1 flex items-center justify-center p-8 text-slate-500 font-semibold">Loading e-Penpal: Write to me...</main>`;
      } else {
        let workspace = '';
        if (appState.composer.active) {
          workspace = renderComposerView(pupil);
        } else if (appState.view === 'topics') {
          workspace = renderTopicsView(pupil);
        } else if (appState.view === 'sent') {
          workspace = renderSentView(pupil);
        } else if (appState.view === 'badges') {
          workspace = renderBadgesView(pupil);
        } else {
          workspace = renderInboxTwoPaneView(pupil);
        }

        mainContent = `
          <div class="flex-1 flex max-w-[1400px] w-full mx-auto">
            ${renderLeftSidebar(pupil)}
            <main class="flex-1 min-w-0 px-4 sm:px-8 py-6 sm:py-8 pb-24">
              ${workspace}
            </main>
          </div>
        `;
      }

      root.innerHTML = `
        ${renderTopBar(pupil)}
        ${mainContent}
      `;

      if (modalRoot) {
        modalRoot.innerHTML = renderModals();
      }

      if (appState.composer.active) {
        renderPostSendFeedbackUnderWritingBox();
      }

      renderWordBuddy();

      if (activeId) {
        const el = document.getElementById(activeId);
        if (el) {
          el.focus();
          if (selStart !== null && typeof el.setSelectionRange === 'function') {
            el.setSelectionRange(selStart, selStart);
          }
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderApp();
    });
  </script>
</body>
</html>
