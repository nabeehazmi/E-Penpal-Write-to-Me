<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-Penpal: Write to me</title>
  <!-- Google Fonts: Nunito for warm rounded headings & Plus Jakarta Sans for crisp 16px+ legibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Nunito"', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 16px;
      color: #1e293b;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 45%, #eef2ff 100%);
      min-height: 100vh;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Nunito', system-ui, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-float {
      animation: floatGentle 3.2s ease-in-out infinite;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.97) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    .animate-shake {
      animation: shakeError 0.35s ease-in-out;
    }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.35); }
      70% { box-shadow: 0 0 0 8px rgba(79, 70, 229, 0); }
      100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
    }
    .speaking-pulse {
      animation: pulseRing 1.4s infinite;
    }
  </style>
</head>

    function buildKidSafeExample(word, pos = 'word') {
      const cleanWord = String(word || '').trim();
      const lowerPos = String(pos || '').toLowerCase();
      if (lowerPos.includes('verb')) {
        return `Try using the action word "${cleanWord}" in a sentence for your pen pal!`;
      }
      if (lowerPos.includes('adjective')) {
        return `You can use "${cleanWord}" to describe something in your email!`;
      }

    function extractTargetWordFromQuery(rawQuery) {
      let cleaned = (rawQuery || '').trim().toLowerCase();
      cleaned = cleaned.replace(/[?!.,'"]+$/g, '').trim();
      const patterns = [
        /^what\s+does\s+(.+?)\s+mean$/,
        /^what\s+is\s+the\s+meaning\s+of\s+(.+)$/,
        /^meaning\s+of\s+(.+)$/,
        /^define\s+(.+)$/,
        /^what\s+is\s+a\s+(.+)$/,
        /^what\s+is\s+an\s+(.+)$/,
        /^what\s+is\s+(.+)$/
      ];
      for (const p of patterns) {
        const m = cleaned.match(p);
        if (m && m[1]) {
          cleaned = m[1].trim();
          break;
        }
      }
      return cleaned;
    }

    function getRootWordCandidates(word) {
      const candidates = [word, word + 's', word + 'es'];
      if (word.endsWith('ies') && word.length > 4) {
        candidates.push(word.slice(0, -3) + 'y');
      }
      if (word.endsWith('es') && word.length > 3) {
        candidates.push(word.slice(0, -2));
      }
      if (word.endsWith('s') && word.length > 3 && !word.endsWith('ss')) {
        candidates.push(word.slice(0, -1));
      }
      if (word.endsWith('ing') && word.length > 5) {
        candidates.push(word.slice(0, -3));
        candidates.push(word.slice(0, -3) + 'e');
      }
      if (word.endsWith('ed') && word.length > 4) {
        candidates.push(word.slice(0, -2));
        candidates.push(word.slice(0, -1));
      }
      return [...new Set(candidates)];
    }

    async function handleWordBuddyLookup(rawInput) {
      const raw = (rawInput || '').trim();
      if (!raw) return;

      appState.wordBuddy.messages.push({
        id: 'wb_u_' + Date.now(),
        sender: 'pupil',
        text: raw
      });

      const targetWord = extractTargetWordFromQuery(raw);

      // Block inappropriate/adult queries immediately
      if (!isChildSafeText(targetWord)) {
        appState.wordBuddy.messages.push({
          id: 'wb_b_' + Date.now(),
          sender: 'bot',
          entry: {
            word: 'School Safe Filter',
            pos: 'kid-friendly helper',
            bm: null,
            def: 'Word Buddy is a Year 4 school dictionary and only shows kid-friendly words! Try searching words like "relative", "hill", "celebrate", or "healthy".',
            example: 'Let us keep our e-Penpal messages polite and friendly!',
            iconType: 'school'
          }
        });
        renderWordBuddy();
        scrollWordBuddyToBottom();
        return;
      }

      const candidates = getRootWordCandidates(targetWord);

      let builtInMatch = null;
      for (const c of candidates) {
        if (WORD_BUDDY_DICTIONARY[c]) {
          builtInMatch = WORD_BUDDY_DICTIONARY[c];
          break;
        }
      }

      if (builtInMatch) {
        appState.wordBuddy.messages.push({
          id: 'wb_b_' + Date.now(),
          sender: 'bot',
          entry: builtInMatch
        });
        renderWordBuddy();
        scrollWordBuddyToBottom();
        return;
      }

      const loadingId = 'wb_load_' + Date.now();
      appState.wordBuddy.messages.push({
        id: loadingId,
        sender: 'bot',
        loading: true,
        queryWord: targetWord
      });
      renderWordBuddy();
      scrollWordBuddyToBottom();

      let fetchedEntry = null;
      for (const candidate of candidates) {
        try {
          const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(candidate)}`);
          if (resp.ok) {
            const data = await resp.json();
            if (Array.isArray(data) && data[0] && Array.isArray(data[0].meanings)) {
              for (const meaning of data[0].meanings) {
                const safeDefObj = (meaning.definitions || []).find(d =>
                  d && d.definition && isChildSafeText(d.definition) && !/\b(vulgar|slang|offensive|taboo|archaic|obsolete)\b/i.test(d.definition)
                );
                if (safeDefObj) {
                  const matchedWord = data[0].word || candidate;
                  const partOfSpeech = meaning.partOfSpeech || 'word';
                  fetchedEntry = {
                    word: matchedWord,
                    pos: partOfSpeech,
                    bm: null,
                    def: safeDefObj.definition,
                    // Never use unvetted external Wiktionary examples — always use a guaranteed kid-safe example!
                    example: buildKidSafeExample(matchedWord, partOfSpeech),
                    iconType: inferIconTypeForWord(matchedWord, safeDefObj.definition)
                  };
                  break;
                }
              }
              if (fetchedEntry) break;
            }
          }
        } catch (err) {}
      }

      appState.wordBuddy.messages = appState.wordBuddy.messages.filter(m => m.id !== loadingId);

      if (fetchedEntry) {
        appState.wordBuddy.messages.push({
          id: 'wb_b_' + Date.now(),
          sender: 'bot',
          entry: fetchedEntry
        });
      } else {
        appState.wordBuddy.messages.push({
          id: 'wb_b_' + Date.now(),
          sender: 'bot',
          entry: {
            word: targetWord,
            pos: 'word helper',
            bm: null,
            def: `I couldn't find "${targetWord}" right now. Check the spelling or try a single word like "hill", "relative", "fever", or "celebrate"!`,
            example: 'Tip: Type one English word at a time (e.g. "hill" or "medicine").',
            iconType: inferIconTypeForWord(targetWord, '')
          }
        });
      }

      renderWordBuddy();
      scrollWordBuddyToBottom();
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function speakBritishEnglish(text) {
      if (!('speechSynthesis' in window)) {
        showToast('Audio speech is not supported in this browser.', 'amber');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const ukVoice =
        voices.find(v => v.lang === 'en-GB' && v.name.includes('Google')) ||
        voices.find(v => v.lang === 'en-GB') ||
        voices.find(v => v.lang.startsWith('en'));
      if (ukVoice) utterance.voice = ukVoice;
      utterance.lang = 'en-GB';
      utterance.rate = 0.92;
      utterance.pitch = 1.03;

      appState.isSpeaking = true;
      renderApp();

      utterance.onend = () => {
        appState.isSpeaking = false;
        renderApp();
      };
      utterance.onerror = () => {
        appState.isSpeaking = false;
        renderApp();
      };
      window.speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      appState.isSpeaking = false;
      renderApp();
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#4f46e5', '#0ea5e9', '#10b981', '#f59e0b', '#ec4899', '#facc15'];
      const particles = Array.from({ length: 100 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        w: Math.random() * 9 + 6,
        h: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        vy: Math.random() * 3.4 + 2.4,
        vx: (Math.random() - 0.5) * 2.8,
        rot: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 8
      }));

      let frame = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.vy;
          p.x += p.vx;
          p.rot += p.vRot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        frame++;
        if (frame < 135) {
          requestAnimationFrame(draw);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(draw);
    }

    function showToast(message, tone = 'indigo') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const tones = {
        indigo: 'bg-indigo-600 text-white border-indigo-400',
        emerald: 'bg-emerald-600 text-white border-emerald-400',
        amber: 'bg-amber-500 text-white border-amber-300'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg border font-semibold text-sm flex items-center gap-2.5 animate-pop ${tones[tone] || tones.indigo}`;
      el.innerHTML = `<span>✨</span><span>${escapeHTML(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 260);

    }

    function levenshteinDistance(a, b) {
      const m = a.length;
      const n = b.length;
      if (Math.abs(m - n) > 2) return 3;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    function findClosestLexiconWord(lowerWord, extraValidSet) {
      if (lowerWord.length < 3) return null;
      let best = null;
      let bestDist = 3;
      const maxAllowed = lowerWord.length >= 5 ? 2 : 1;

      const checkCandidate = (cand) => {
        if (Math.abs(cand.length - lowerWord.length) > maxAllowed) return;
        const d = levenshteinDistance(lowerWord, cand);
        if (d <= maxAllowed && d < bestDist) {
          bestDist = d;
          best = cand;
        }
      };

      for (const w of extraValidSet) checkCandidate(w);
      for (const w of YEAR4_LEXICON) {
        checkCandidate(w);
        if (bestDist === 1 && best && best[0] === lowerWord[0]) break;
      }
      return best;
    }

    function checkTextSpellingAndTypos(text, fieldLabel, extraValidWords, errors) {
      if (!text) return;
      const tokenRegex = /[A-Za-z]+(?:'[A-Za-z]+)?/g;
      let match;
      const reportedWords = new Set();

      while ((match = tokenRegex.exec(text)) !== null) {
        const rawWord = match[0];
        const lower = rawWord.toLowerCase();
        const isCapitalized = /^[A-Z]/.test(rawWord);

        if (reportedWords.has(lower)) continue;

        if (COMMON_TYPOS[lower]) {
          reportedWords.add(lower);
          errors.push(`Typo / Spelling (${fieldLabel}): Did you mean "${COMMON_TYPOS[lower]}" instead of "${rawWord}"?`);
          continue;
        }

        if (!isCapitalized && PROPER_CAPITALIZATION[lower]) {
          reportedWords.add(lower);
          errors.push(`Capital Letter (${fieldLabel}): Write "${PROPER_CAPITALIZATION[lower]}" with a capital letter instead of "${rawWord}".`);
          continue;
        }

        if (isCapitalized) continue;

        if (YEAR4_LEXICON.has(lower) || extraValidWords.has(lower)) continue;

        reportedWords.add(lower);
        const closest = findClosestLexiconWord(lower, extraValidWords);
        if (closest) {
          errors.push(`Typo / Spelling (${fieldLabel}): Check "${rawWord}" — did you mean "${closest}"?`);
        } else {
          errors.push(`Spelling Check (${fieldLabel}): The word "${rawWord}" is not recognised. Check your spelling or ask Word Buddy!`);
        }
      }
    }

        checkQ(0, /\b(feel|feeling|healthy|well|fine|good|great|happy|energetic|strong|okay|tired|sleepy|sick|ill|cold|fever|headache)\b/.test(bodyLower));
        checkQ(1, /\b(rest|resting|sleep|sleeping|bed|home|drink|drinking|water|warm|medicine|doctor|clinic|hospital|soup|porridge|bath|shower|stay)\b/.test(bodyLower));
        checkQ(2, /\b(should|shouldn't|should not)\b/.test(bodyLower));
      } else if (topicId === 'kumar' && roundNum === 2) {
        const hasModal = /\b(should|shouldn't|should not)\b/.test(bodyLower);
        const hasThroatCare = /\b(water|warm|drink|rest|doctor|clinic|medicine|lozenge|honey|tea|gargle|ice cream|cold|sweet|sweets|spicy|fried|shout|talk|sleep)\b/.test(bodyLower);
        checkQ(0, hasModal && hasThroatCare);
        checkQ(1, /\b(eat|eating|fruit|fruits|vegetable|vegetables|drink|drinking|water|milk|juice|brush|teeth|wash|hand|hands|bath|shower|sleep|early|exercise|exercising|run|jog|walk|sport|badminton|football|play|stretch|breakfast|healthy|clean)\b/.test(bodyLower));
      }
    }

    function validateEmailBeforeSend(composer, pupil, topic, roundData) {
      const errors = [];
      const subject = composer.subject.trim();
      const salutation = composer.salutation.trim();
      const body = composer.body.trim();
      const closing = composer.closing.trim();
      const penpalLower = topic.penpalName.toLowerCase();
      const pupilLower = pupil.name.toLowerCase();
      const requiredQuestions = roundData.questions.length;

      const extraValidWords = new Set([penpalLower, pupilLower]);
      pupilLower.split(/\s+/).forEach(part => { if (part) extraValidWords.add(part); });
      Object.values(roundData.scaffold.wordBank).forEach(arr => {
        arr.forEach(phrase => {
          phrase.toLowerCase().split(/\s+/).forEach(w => {
            const clean = w.replace(/[^a-z']/g, '');
            if (clean) extraValidWords.add(clean);
          });
        });
      });

      // 1. Check Email Header Subject
      if (!subject || subject.length < 3 || subject.includes('...')) {
        errors.push('Email Header: Please write a clear Subject line without unfinished "..." dots.');
      } else {
        checkTextSpellingAndTypos(subject, 'Subject', extraValidWords, errors);
      }

      // 2. Check Salutation
      if (!salutation) {
        errors.push(`Salutation: Write a friendly greeting at the top, such as "Hi ${topic.penpalName}, how are you? I hope you are doing well."`);
      } else if (salutation.includes('...')) {
        errors.push('Salutation: Replace "..." with your complete greeting.');
      } else {
        const salLower = salutation.toLowerCase();
        const hasGreeting = /\b(dear|hi|hello|hey)\b/.test(salLower);
        const hasPenpal = salLower.includes(penpalLower);
        const hasPunct = /[,!.?]$/.test(salutation);
        if (!hasGreeting || !hasPenpal) {
          errors.push(`Salutation: Include a greeting and ${topic.penpalName}'s name (e.g. "Hi ${topic.penpalName}, how are you? I hope you are doing well.").`);
        } else if (!hasPunct) {
          errors.push('Salutation: Put a comma, exclamation mark, or full stop at the end of your greeting.');
        }
        checkTextSpellingAndTypos(salutation, 'Salutation', extraValidWords, errors);
      }

      // 3. Check Main Body
      if (!body) {
        errors.push(`Main Body: Your message box is empty! Answer all ${requiredQuestions} questions in complete sentences.`);
      } else {
        if (body.includes('...') || body.includes('___') || /\[[^\]]*\]/.test(body)) {
          errors.push('Unfinished Starter: Please replace "...", "___", or brackets [ ] with your own complete words.');
        }

        const missingSpaceMatch = body.match(/([a-zA-Z0-9])([.!?])([A-Za-z])/);
        if (missingSpaceMatch) {
          errors.push(`Spacing: Put a space after "${missingSpaceMatch[2]}" before starting "${missingSpaceMatch[3]}...".`);
        }

        const repeatedWordMatch = body.match(/\b([a-zA-Z]+)\s+\1\b/i);
        if (repeatedWordMatch) {
          errors.push(`Repeated Word: You wrote "${repeatedWordMatch[1]} ${repeatedWordMatch[1]}" twice in a row.`);
        }

        checkTextSpellingAndTypos(body, 'Main Body', extraValidWords, errors);

        const sentences = body
          .split(/(?<=[.!?])\s+|\n+/)
          .map(s => s.trim())
          .filter(Boolean);

        if (sentences.length < requiredQuestions) {
          const qList = roundData.questions.map(q => q.id).join(', ');
          errors.push(`Answer All Questions: You wrote ${sentences.length} sentence(s). Please write at least ${requiredQuestions} complete sentences to answer ${qList}.`);
        }

        sentences.forEach((sent, idx) => {
          const num = idx + 1;
          if (/^[a-z]/.test(sent)) {
            errors.push(`Capital Letter (Sentence ${num}): Start "${sent.slice(0, 26)}..." with a capital letter.`);
          }
          if (!/[.!?]$/.test(sent)) {
            errors.push(`End Punctuation (Sentence ${num}): End "${sent.slice(0, 28)}" with a full stop (.), exclamation mark (!), or question mark (?).`);
          }
          if (/\bi\b/.test(sent)) {
            errors.push(`Capital "I" (Sentence ${num}): Always write the pronoun "I" as a capital letter.`);
          }

          if (/^because\b/i.test(sent)) {
            errors.push(`Sentence Fragment (Sentence ${num}): Do not start a sentence with "Because" on its own — join it to the first part (e.g. "I like Friday because we have Art.").`);
          }

          const withoutPunct = sent.replace(/[.!?]+$/, '').trim();
          const words = withoutPunct.split(/\s+/);
          const lastWord = (words[words.length - 1] || '').toLowerCase();
          const danglingWords = [
            'because', 'and', 'or', 'but', 'so', 'when', 'if',
            'is', 'am', 'are', 'was', 'were', 'have', 'has',
            'to', 'in', 'at', 'on', 'by', 'with', 'from', 'of', 'for',
            'a', 'an', 'the', 'my', 'your', 'his', 'her', 'our', 'their',
            'should', "shouldn't", 'wear', 'visit', 'celebrate', 'feel', 'eat', 'drink'
          ];
          if (words.length <= 2 || danglingWords.includes(lastWord)) {
            errors.push(`Incomplete Sentence (Sentence ${num}): "${sent}" is unfinished. Complete your full thought before the full stop.`);
          }
        });

        const grammarRules = [
          {
            regex: /\bi\s+is\b/i,
            msg: 'Subject-Verb Agreement: Use "I am" instead of "I is".'
          },
          {
            regex: /\bi\s+are\b/i,
            msg: 'Subject-Verb Agreement: Use "I am" instead of "I are".'
          },
          {
            regex: /\bi\s+has\b/i,
            msg: 'Subject-Verb Agreement: Use "I have" instead of "I has".'
          },
          {
            regex: /\b(i|you|we|they)\s+(goes|likes|loves|plays|eats|drinks|visits|lives|celebrates|helps|rests|feels|wears|reads|writes|studies|cooks|cleans|watches)\b/i,
            msg: 'Subject-Verb Agreement: Do not add "-s" to the verb after "I", "you", "we", or "they" (e.g. write "I like", not "I likes").'
          },
          {
            regex: /\b(he|she)\s+(am|are)\b/i,
            msg: 'Subject-Verb Agreement: Use "He is" or "She is" for one person.'
          },
          {
            regex: /\b(he|she|my\s+sister|my\s+brother|my\s+friend|my\s+mother|my\s+father)\s+have\b/i,
            msg: 'Subject-Verb Agreement: Use "has" (not "have") for one person (e.g. "She has" or "My sister has").'
          },
          {
            regex: /\b(he|she)\s+(go|like|love|play|eat|drink|visit|live|feel|wear|read|help)\b/i,
            msg: 'Subject-Verb Agreement: Add "-s" or "-es" to the verb after "he" or "she" (e.g. "She likes", "He goes").'
          },
          {
            regex: /\b(they|we)\s+(is|am)\b/i,
            msg: 'Subject-Verb Agreement: Use "They are" or "We are" for more than one person.'
          },
          {
            regex: /\b(they|we)\s+has\b/i,
            msg: 'Subject-Verb Agreement: Use "They have" or "We have" instead of "has".'
          },
          {
            regex: /\b(?:my\s+favourite\s+(?:place|food|subject|day|festival|celebration|sport|drink|part)|a\s+place\s+i\s+like\s+to\s+visit)(?:\s+of\s+the\s+day|\s+to\s+\w+)?\s+are\b/i,
            msg: 'Subject-Verb Agreement: Singular subjects like "My favourite day" or "My favourite place" take "is", not "are".'
          },
          {
            regex: /\bthere\s+is\s+(many|two|three|four|five|lots\s+of)\b/i,
            msg: 'Subject-Verb Agreement: Use "There are" before plural nouns (e.g. "There are many...").'
          },
          {
            regex: /\b(am|is|are)\s+(go|live|visit|eat|drink|play|celebrate|feel|wear|sleep|rest|study|help)\b/i,
            msg: 'Verb Form: Do not put "am/is/are" directly before a plain verb (write "I live" or "I am living", not "I am live").'
          },
          {
            regex: /\b(like|likes|love|loves)\s+(visit|eat|play|go|swim|read|celebrate|help|take)\b/i,
            msg: 'Verb Pattern: After "like" or "love", use "to + verb" or "-ing" (e.g. "I like to visit..." or "I like visiting...").'
          },
          {
            regex: /\b(enjoy|enjoys)\s+to\s+\w+/i,
            msg: 'Verb Pattern: After "enjoy", use an "-ing" verb (e.g. "I enjoy celebrating..." or "I enjoy eating...").'
          },
          {
            regex: /\b(should|shouldn't|should not)\s+to\s+\w+/i,
            msg: 'Modal Verb Rule: Do not put "to" after "should" (write "She should drink", not "should to drink").'
          },
          {
            regex: /\b(should|shouldn't|should not)\s+(drinks|eats|rests|sees|takes|sleeps|goes|drinking|eating|resting|seeing|taking|sleeping|going)\b/i,
            msg: 'Modal Verb Rule: Always use the base verb after "should" or "shouldn\'t" (e.g. "should drink", "shouldn\'t eat").'
          },
          {
            regex: /\ba\s+(apple|orange|egg|ice\s+cream|island|interesting|exciting|awesome|activity|occasion|earache|afternoon|evening)\b/i,
            msg: 'Article Check (a / an): Use "an" before words starting with a vowel sound (e.g. "an interesting place", "an apple").'
          },
          {
            regex: /\ban\s+(beach|cold|fever|book|friend|place|day|school|house|family|doctor|medicine|celebration|healthy|beautiful)\b/i,
            msg: 'Article Check (a / an): Use "a" before words starting with a consonant sound (e.g. "a cold", "a beach").'
          }
        ];

        grammarRules.forEach(rule => {
          if (rule.regex.test(body)) {
            errors.push(rule.msg);
          }
        });

        checkPerQuestionAnswers(topic.id, composer.round, body.toLowerCase(), roundData, errors);
      }

      // 4. Check Closing & Signature
      if (!closing) {
        errors.push(`Closing & Signature: Add a friendly closing and your name at the bottom (e.g. "Your friend,\\n${pupil.name}").`);
      } else if (closing.includes('...')) {
        errors.push('Closing & Signature: Replace "..." with your closing phrase and your first name.');
      } else {
        const hasClosingPhrase = /\b(friend|pen pal|wishes|regards|sincerely|cheers|love)\b/i.test(closing);
        const hasPupilSignature = closing.toLowerCase().includes(pupilLower);
        if (!hasClosingPhrase) {
          errors.push('Closing Phrase: Include a friendly closing line like "Your friend," or "Warm wishes," before your name.');
        }
        if (!hasPupilSignature) {
          errors.push(`Signature: Sign your first name "${pupil.name}" at the bottom of your closing.`);
        }
        checkTextSpellingAndTypos(closing, 'Closing', extraValidWords, errors);
      }

      return errors;
    }

    /*************************************************************************
     * 8. POST-SEND CORRECTION BOX RENDERER (SHOWN UNDER WRITING BOX ONLY ON SEND)
     *************************************************************************/
    function renderPostSendFeedbackUnderWritingBox() {
      const container = document.getElementById('post-send-feedback-slot');
      const sendBtn = document.getElementById('send-email-btn');
      if (!container) return;

      const comp = appState.composer;
      if (!comp.attemptedSend || comp.errors.length === 0) {
        container.innerHTML = '';
        if (sendBtn) {
          sendBtn.className = 'px-7 py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-display font-extrabold text-base shadow-sm transition flex items-center gap-2';
        }
        return;
      }

      container.innerHTML = `
        <div id="validation-feedback-box" class="rounded-3xl bg-rose-50 border-2 border-rose-500 p-5 sm:p-6 space-y-3 shadow-xs">
          <div class="font-display font-extrabold text-rose-700 text-base flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span>🛑</span>
              <span>Fix ${comp.errors.length} item(s) in red below before sending:</span>
            </div>
            <span class="px-2.5 py-0.5 rounded-full bg-rose-600 text-white text-xs font-extrabold">Cannot Send Yet</span>
          </div>
          <div class="space-y-2">
            ${comp.errors.map((err, i) => `
              <div class="flex items-start gap-3 p-3 rounded-2xl bg-white border border-rose-200 text-sm font-semibold text-rose-900">
                <span class="w-6 h-6 rounded-full bg-rose-600 text-white font-extrabold text-xs flex items-center justify-center shrink-0 mt-0.5">${i + 1}</span>

    function handleCreatePupil(nameInput, avatar) {
      const clean = (nameInput || '').trim();
      if (!clean) {
        showToast('Please enter your first name to begin!', 'amber');
        return;
      }
      const profile = createPupilProfile(clean, avatar);
      appState.profiles[profile.id] = profile;
      appState.currentPupilId = profile.id;
      appState.modal = null;
      appState.view = 'inbox';
      appState.selectedEmailId = profile.inbox[0].id;
      appState.mobileReadingOpen = false;
      appState.composer.active = false;
      appState.celebrationBanner = null;
      saveState();
      showToast(`Welcome to e-Penpal: Write to me, ${profile.name}!`, 'emerald');
      renderApp();
    }

    function handleSwitchPupil(pupilId) {
      if (!appState.profiles[pupilId]) return;
      appState.currentPupilId = pupilId;
      appState.modal = null;
      appState.view = 'inbox';
      const inbox = appState.profiles[pupilId].inbox;
      appState.selectedEmailId = inbox && inbox[0] ? inbox[0].id : null;
      appState.mobileReadingOpen = false;
      appState.composer.active = false;
      appState.celebrationBanner = null;
      saveState();
      showToast(`Switched to ${appState.profiles[pupilId].name}'s mailbox!`, 'indigo');
      renderApp();
    }

    function selectInboxEmail(emailId) {
      const pupil = getCurrentPupil();
      if (!pupil) return;
      const mail = pupil.inbox.find(e => e.id === emailId);
      if (!mail) return;
      mail.unread = false;
      appState.selectedEmailId = emailId;
      appState.mobileReadingOpen = true;
      appState.composer.active = false;
      saveState();
      renderApp();
    }

    function openTopicRound(topicId, round = 1) {
      const pupil = getCurrentPupil();
      const topic = TOPICS.find(t => t.id === topicId);
      if (!pupil || !topic) return;

      if (round === 2) {
        const r2Id = `${topic.id}_r2`;
        if (!pupil.inbox.some(e => e.id === r2Id)) {
          const r1Body = (pupil.topicProgress[topic.id] && pupil.topicProgress[topic.id].round1ReplyBody) || '';
          const reaction = buildAdaptiveRound2Reaction(topic.id, r1Body);
          pupil.inbox.unshift({
            id: r2Id,
            topicId: topic.id,
            round: 2,
            penpalName: topic.penpalName,
            email: topic.email,
            city: topic.city,
            topicLabel: topic.topicLabel,
            subject: topic.round2.subject,
            time: topic.round2.time,
            salutation: topic.round2.salutation,
            storyParagraph: `${reaction} ${topic.round2.defaultStoryParagraph}`.trim(),
            questions: topic.round2.questions,
            closingLine1: topic.round2.closingLine1,
            closingLine2: topic.round2.closingLine2,
            unread: false,
            replied: false
          });
          saveState();
        }
        appState.view = 'inbox';
        appState.selectedEmailId = r2Id;
        appState.mobileReadingOpen = true;
        appState.composer.active = false;
        renderApp();
        return;
      }

      appState.view = 'inbox';
      appState.selectedEmailId = `${topic.id}_r1`;
      appState.mobileReadingOpen = true;
      appState.composer.active = false;
      const mail = pupil.inbox.find(e => e.id === `${topic.id}_r1`);
      if (mail) mail.unread = false;
      saveState();
      renderApp();
    }

    function startReplyComposer(topicId, round = 1) {
      const pupil = getCurrentPupil();
      const topic = TOPICS.find(t => t.id === topicId);
      if (!pupil || !topic) return;
      const roundData = round === 2 ? topic.round2 : topic.round1;

      stopSpeech();
      appState.view = 'inbox';
      appState.composer = {
        active: true,
        topicId: topic.id,
        round,
        helpOpen: false,
        helpTab: 'guide',
        subject: roundData.subject.startsWith('Re:') ? roundData.subject : `Re: ${roundData.subject}`,
        salutation: '',
        body: '',
        closing: `Your friend,\n${pupil.name}`,
        errors: [],
        attemptedSend: false,
        hadErrorsBeforeSend: false
      };
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function applyClosingQuickFill(phrase) {
      appState.composer.closing = phrase;
      renderApp();
    }

    function handleSendEmail() {
      const pupil = getCurrentPupil();
      const topic = TOPICS.find(t => t.id === appState.composer.topicId);
      if (!pupil || !topic) return;
      const round = appState.composer.round;
      const roundData = round === 2 ? topic.round2 : topic.round1;

      const errors = validateEmailBeforeSend(appState.composer, pupil, topic, roundData);
      if (errors.length > 0) {
        appState.composer.errors = errors;
        appState.composer.attemptedSend = true;
        appState.composer.hadErrorsBeforeSend = true;
        renderPostSendFeedbackUnderWritingBox();
        const errBox = document.getElementById('validation-feedback-box');
        if (errBox) {
          errBox.classList.remove('animate-shake');
          void errBox.offsetWidth;
          errBox.classList.add('animate-shake');
          errBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        return;
      }

      // Passed all Year 4 checks!
      const firstTryClean = !appState.composer.hadErrorsBeforeSend;
      const baseXP = round === 2 ? 75 : 50;
      const bonusXP = firstTryClean ? 15 : 0;
      const earnedXP = baseXP + bonusXP;

      pupil.xp = (pupil.xp || 0) + earnedXP;

      const currentMail = pupil.inbox.find(e => e.topicId === topic.id && e.round === round);
      if (currentMail) {
        currentMail.replied = true;
        currentMail.unread = false;
      }

      pupil.sent.unshift({
        id: 'sent_' + Date.now(),
        topicId: topic.id,
        topicLabel: topic.topicLabel,
        round,
        toName: topic.penpalName,
        toEmail: topic.email,
        subject: appState.composer.subject.trim(),
        salutation: appState.composer.salutation.trim(),
        body: appState.composer.body.trim(),
        closing: appState.composer.closing.trim(),
        sentAt: new Date().toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' }) + ', ' +
                new Date().toLocaleDateString('en-MY', { day: '2-digit', month: 'short' }),
        xpEarned: earnedXP
      });

      const newBadges = [];
      function unlockBadge(badgeId) {
        if (!pupil.badges.includes(badgeId)) {
          pupil.badges.push(badgeId);
          const found = BADGES_CATALOG.find(b => b.id === badgeId);
          if (found) newBadges.push(found);
        }
      }
      unlockBadge('first_email');
      if (firstTryClean) unlockBadge('grammar_star');

      let round2Delivered = false;
      const r2Id = `${topic.id}_r2`;

      if (round === 1) {
        pupil.topicProgress[topic.id].round1Done = true;
        pupil.topicProgress[topic.id].round1ReplyBody = appState.composer.body.trim();

        if (!pupil.inbox.some(e => e.id === r2Id)) {
          const reaction = buildAdaptiveRound2Reaction(topic.id, appState.composer.body.trim());
          pupil.inbox.unshift({
            id: r2Id,
            topicId: topic.id,
            round: 2,
            penpalName: topic.penpalName,
            email: topic.email,
            city: topic.city,
            topicLabel: topic.topicLabel,
            subject: topic.round2.subject,
            time: topic.round2.time,
            salutation: topic.round2.salutation,
            storyParagraph: `${reaction} ${topic.round2.defaultStoryParagraph}`.trim(),
            questions: topic.round2.questions,
            closingLine1: topic.round2.closingLine1,
            closingLine2: topic.round2.closingLine2,
            unread: true,
            replied: false
          });
          round2Delivered = true;
        }
      } else {
        pupil.topicProgress[topic.id].round2Done = true;
        unlockBadge(topic.badge.id);
        if (getCompletedTopicsCount(pupil) === TOPICS.length) {
          unlockBadge('super_penpal');
        }
      }

      appState.composer.active = false;
      appState.view = 'inbox';
      appState.inboxFilter = 'all';
      appState.mobileReadingOpen = false;
      appState.selectedEmailId = round2Delivered ? r2Id : (pupil.inbox[0] ? pupil.inbox[0].id : null);
      appState.celebrationBanner = {
        penpalName: topic.penpalName,
        topicId: topic.id,
        topicLabel: topic.topicLabel,
        round,
        earnedXP,
        firstTryClean,
        round2Delivered,
        r2Id,
        newBadges
      };

      saveState();
      triggerConfetti();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateLiveCounters() {
      const el = document.getElementById('live-counter');
      if (!el) return;
      const body = appState.composer.body;
      const wordCount = body.trim() ? body.trim().split(/\s+/).length : 0;
      const sentenceCount = body.trim()
        ? body.trim().split(/(?<=[.!?])\s+|\n+/).filter(Boolean).length
        : 0;
      el.textContent = `${sentenceCount} sentence(s) • ${wordCount} word(s)`;
    }

    function renderWordBuddy() {

      const wb = appState.wordBuddy;

      wbRoot.innerHTML = `

            <span>Word Buddy</span>

                <div>
                  <div class="font-display font-extrabold text-base leading-tight">Word Buddy</div>
                  <div class="text-[11px] font-bold text-amber-950/80">Picture Dictionary & Meanings</div>
                </div>
              </div>
              <button onclick="appState.wordBuddy.open=false; renderWordBuddy();"
                aria-label="Close Word Buddy"
                class="w-8 h-8 rounded-full bg-white/50 hover:bg-white/80 font-extrabold text-slate-900 text-sm">
                ✕
              </button>
            </div>

            <div id="word-buddy-messages" class="p-4 overflow-y-auto space-y-3.5 flex-1 bg-slate-50/70 max-h-[380px]">
              ${wb.messages.map(msg => {
                if (msg.sender === 'pupil') {
                  return `
                    <div class="flex justify-end">
                      <div class="px-4 py-2 rounded-2xl rounded-br-sm bg-indigo-600 text-white text-sm font-semibold max-w-[80%]">
                        ${escapeHTML(msg.text)}
                      </div>
                    </div>
                  `;

                if (msg.welcome) {
                  return `
                    <div class="bg-white rounded-2xl p-4 border border-slate-200/80 space-y-2.5 text-xs sm:text-sm text-slate-700">
                      <div class="font-display font-extrabold text-base text-slate-900">

                        Type <strong>any English word</strong> you don't know (or ask <em>"what does ... mean?"</em>), and I will show you a <strong>picture</strong>, its <strong>meaning</strong>, and how to say it!
                      </p>
                      <div class="flex flex-wrap gap-1.5 pt-1">
                        ${quickWords.map(w => `
                          <button type="button" onclick="handleWordBuddyLookup(${toInlineJsArg(w)})"

                            ${escapeHTML(w)}
                          </button>
                        `).join('')}
                      </div>
                    </div>
                  `;
                }
                if (msg.loading) {
                  return `
                    <div class="bg-white rounded-2xl p-3.5 border border-slate-200 text-xs text-slate-600 font-semibold flex items-center gap-2">

                    ${getDictionaryIllustrationSvg(entry.iconType, entry.word)}

                      </div>
                      <button type="button" onclick="speakBritishEnglish(${toInlineJsArg(audioText)})"
                        class="px-3 py-1 rounded-full bg-sky-100 hover:bg-sky-200 text-sky-900 text-xs font-extrabold shrink-0 transition">

                    </div>
                    <p class="text-xs sm:text-sm text-slate-700 leading-snug">
                      <strong>Meaning:</strong> ${escapeHTML(entry.def)}
                    </p>
                    <div class="p-2.5 rounded-xl bg-amber-50/80 border border-amber-200/60 text-xs text-slate-700 italic">
                      "${escapeHTML(entry.example)}"

                  </div>

              }).join('')}
            </div>

            <form onsubmit="event.preventDefault(); const inp = document.getElementById('wb-chat-input'); const val = inp.value; inp.value=''; handleWordBuddyLookup(val);"
              class="p-3 bg-white border-t border-slate-200 flex items-center gap-2">
              <input id="wb-chat-input" type="text"
                placeholder="Type any English word..."
                class="flex-1 px-3.5 py-2.5 rounded-2xl bg-slate-100 border border-slate-200 focus:bg-white focus:border-amber-400 focus:outline-none text-sm font-semibold" />
              <button type="submit"
                class="px-4 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm transition">
                Ask
              </button>
            </form>
          </div>
        `}
      `;
    }

    /*************************************************************************
     * 15. FIRST-TIME ONBOARDING & CHANGE NAME MODALS
     *************************************************************************/
    function renderModals() {
      if (!appState.modal) return '';

      if (appState.modal === 'onboarding') {
        const savedProfiles = Object.values(appState.profiles);
        return `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
            <div class="bg-white rounded-3xl max-w-md w-full p-7 sm:p-8 shadow-2xl border border-slate-200/80 animate-pop space-y-5">
              <div class="text-center">
                <div class="mb-2 flex justify-center animate-float">
                  ${getBrandLogoSvg('h-24 sm:h-28 w-auto')}
                </div>
                <h2 class="font-display font-extrabold text-xl text-slate-900">e-Penpal: Write to me</h2>
                <p class="text-sm text-slate-600 mt-1">
                  Enter your first name and pick an animal avatar to open your mailbox.
                </p>
              </div>

              <form onsubmit="event.preventDefault(); const n = document.getElementById('onboard-name').value; const a = document.querySelector('input[name=onboard_avatar]:checked').value; handleCreatePupil(n, a);"
                class="space-y-4">
                <div>
                  <label for="onboard-name" class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">
                    Your First Name
                  </label>
                  <input id="onboard-name" type="text" required maxlength="24" autofocus
                    placeholder="e.g. Aisyah, Daniel, Mei Ling..."
                    class="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:outline-none text-base font-bold text-slate-900" />
                </div>

                <div>
                  <span class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">
                    Pick Your Avatar
                  </span>
                  <div class="grid grid-cols-6 gap-2">
                    ${PUPIL_AVATARS.map((av, idx) => `
                      <label class="cursor-pointer">
                        <input type="radio" name="onboard_avatar" value="${av}" ${idx === 0 ? 'checked' : ''} class="peer sr-only" />
                        <div class="h-12 rounded-2xl border-2 border-slate-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 flex items-center justify-center text-2xl transition hover:scale-105">
                          ${av}
                        </div>
                      </label>
                    `).join('')}
                  </div>
                </div>

                <div class="p-3.5 rounded-2xl bg-sky-50 border border-sky-100 text-xs text-sky-900 flex items-start gap-2">
                  <span>🛡️</span>
                  <span><strong>Online Safety Tip:</strong> Only use your first name. Never share your home address, phone number, or real email password!</span>
                </div>

                <button type="submit"
                  class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-display font-extrabold text-base shadow-sm transition">
                  Start Writing →
                </button>
              </form>

              ${savedProfiles.length > 0 ? `
                <div class="pt-4 border-t border-slate-100">
                  <div class="text-xs font-extrabold text-slate-400 mb-2">Or continue as a saved pupil:</div>
                  <div class="flex flex-wrap gap-2">
                    ${savedProfiles.map(p => `
                      <button type="button" onclick="handleSwitchPupil('${p.id}')"
                        class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-indigo-50 text-slate-800 hover:text-indigo-700 text-xs font-bold transition">
                        ${p.avatar} ${escapeHTML(p.name)}
                      </button>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }

      if (appState.modal === 'change_name') {
        const savedProfiles = Object.values(appState.profiles);
        return `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
            <div class="bg-white rounded-3xl max-w-md w-full p-7 shadow-2xl border border-slate-200 animate-pop space-y-5">
              <div class="flex items-center justify-between">
                <h2 class="font-display font-extrabold text-xl text-slate-900">Change Name / Switch Pupil</h2>
                <button onclick="appState.modal=null; renderApp();" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold text-slate-600">✕</button>
              </div>

              ${savedProfiles.length > 0 ? `
                <div class="space-y-2 max-h-48 overflow-y-auto">
                  ${savedProfiles.map(p => `
                    <button onclick="handleSwitchPupil('${p.id}')"
                      class="w-full p-3 rounded-2xl border flex items-center justify-between transition ${p.id === appState.currentPupilId ? 'bg-indigo-50 border-indigo-300' : 'bg-white border-slate-200 hover:bg-slate-50'}">
                      <div class="flex items-center gap-3">
                        <span class="text-2xl">${p.avatar}</span>
                        <div class="text-left">
                          <div class="font-extrabold text-sm text-slate-900">${escapeHTML(p.name)}</div>
                          <div class="text-xs text-slate-500">${p.xp} XP • Level ${getLevelFromXP(p.xp)}</div>
                        </div>
                      </div>
                      <span class="text-xs font-extrabold text-indigo-600">${p.id === appState.currentPupilId ? 'Current' : 'Open →'}</span>
                    </button>
                  `).join('')}
                </div>
              ` : ''}

              <form onsubmit="event.preventDefault(); const n = document.getElementById('switch-name').value; const a = document.querySelector('input[name=switch_avatar]:checked').value; handleCreatePupil(n, a);"
                class="pt-4 border-t border-slate-100 space-y-3">
                <div class="text-xs font-extrabold uppercase tracking-wider text-slate-400">New Pupil Mailbox</div>
                <input id="switch-name" type="text" required maxlength="24"
                  placeholder="Enter first name..."
                  class="w-full px-4 py-2.5 rounded-2xl border border-slate-300 focus:border-indigo-500 focus:outline-none text-sm font-bold" />
                <div class="grid grid-cols-6 gap-1.5">
                  ${PUPIL_AVATARS.map((av, idx) => `
                    <label class="cursor-pointer">
                      <input type="radio" name="switch_avatar" value="${av}" ${idx === 0 ? 'checked' : ''} class="peer sr-only" />
                      <div class="h-10 rounded-xl border border-slate-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 flex items-center justify-center text-xl">
                        ${av}
                      </div>
                    </label>
                  `).join('')}
                </div>
                <button type="submit"
                  class="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-display font-extrabold text-sm">
                  Create Mailbox
                </button>
              </form>
            </div>
          </div>
        `;
      }

      return '';
    }

    /*************************************************************************
     * 16. MAIN RENDERER & INITIALIZATION
     *************************************************************************/
    function renderApp() {
      const root = document.getElementById('app-root');
      const modalRoot = document.getElementById('modal-root');
      if (!root) return;

      const pupil = getCurrentPupil();

      const activeId = document.activeElement ? document.activeElement.id : null;
      const selStart = document.activeElement && typeof document.activeElement.selectionStart === 'number'
        ? document.activeElement.selectionStart
        : null;

      let mainContent = '';
      if (!pupil) {
        mainContent = `<main class="flex-1 flex items-center justify-center p-8 text-slate-500 font-semibold">Loading e-Penpal: Write to me...</main>`;
      } else {
        let workspace = '';
        if (appState.composer.active) {
          workspace = renderComposerView(pupil);
        } else if (appState.view === 'topics') {
          workspace = renderTopicsView(pupil);
        } else if (appState.view === 'sent') {
          workspace = renderSentView(pupil);
        } else if (appState.view === 'badges') {
          workspace = renderBadgesView(pupil);
        } else {
          workspace = renderInboxTwoPaneView(pupil);
        }

        mainContent = `
          <div class="flex-1 flex max-w-[1400px] w-full mx-auto">
            ${renderLeftSidebar(pupil)}
            <main class="flex-1 min-w-0 px-4 sm:px-8 py-6 sm:py-8 pb-24">
              ${workspace}
            </main>
          </div>
        `;
      }

      root.innerHTML = `
        ${renderTopBar(pupil)}
        ${mainContent}
      `;

      if (modalRoot) {
        modalRoot.innerHTML = renderModals();
      }

      if (appState.composer.active) {
        renderPostSendFeedbackUnderWritingBox();
      }

      renderWordBuddy();

      if (activeId) {
        const el = document.getElementById(activeId);
        if (el) {
          el.focus();
          if (selStart !== null && typeof el.setSelectionRange === 'function') {
            el.setSelectionRange(selStart, selStart);
          }
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderApp();
    });
  </script>
</body>
</html>
